name: Web transformation boundary

on:
  pull_request:
  push:
    branches:
      - modular-architecture
      - codex/web-transformation

jobs:
  phase-0-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select comparison base
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BASE"
          fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Check frozen mobile sources
        run: >-
          python scripts/check_mobile_boundary.py
          --base "${{ steps.comparison.outputs.base }}"
          --head HEAD

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Phase 0 architecture contracts
        run: >-
          python -m pytest -q
          tests/architecture/test_contracts_ds.py
          tests/architecture/test_web_transformation_phase_0_ds.py
